name: release

# Push a tag like v0.4.11 (or run manually) to build the Windows exe and the
# macOS binary and attach both to the matching GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m PyInstaller --noconfirm agent.spec
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop_agent/dist/netsync-agent.exe

  macos-agent:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m PyInstaller --noconfirm agent-mac.spec
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop_agent/dist/netsync-agent-macos
